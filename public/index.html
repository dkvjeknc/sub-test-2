<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AMIRALI — Private Network</title>

<meta name="theme-color" content="#050805">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Inter,Arial,sans-serif;
  color:#eaffea;
  background:
    radial-gradient(circle at 50% 0%,#123d20 0%,transparent 40%),
    radial-gradient(circle at 100% 100%,#0c3518 0%,transparent 35%),
    #030603;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.container{
  width:100%;
  max-width:470px;
}

.logo{
  text-align:center;
  margin-bottom:24px;
}

.logo h1{
  font-size:38px;
  letter-spacing:7px;
  font-weight:800;
}

.logo p{
  margin-top:8px;
  color:#75d98a;
  font-size:12px;
  letter-spacing:4px;
}

.card{
  position:relative;
  overflow:hidden;
  border:1px solid rgba(105,255,133,.22);
  border-radius:28px;
  padding:26px;
  background:rgba(9,17,10,.78);
  backdrop-filter:blur(25px);
  box-shadow:
    0 30px 80px rgba(0,0,0,.55),
    inset 0 0 40px rgba(55,255,100,.025);
}

.status{
  display:flex;
  align-items:center;
  gap:9px;
  color:#8dff9f;
  font-size:12px;
  letter-spacing:2px;
  margin-bottom:25px;
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#53ff75;
  box-shadow:0 0 14px #53ff75;
}

.usage{
  text-align:center;
  padding:10px 0 25px;
}

.usage .big{
  font-size:44px;
  font-weight:800;
}

.usage .small{
  color:#7e9882;
  font-size:13px;
  margin-top:5px;
}

.bar{
  height:9px;
  background:#142118;
  border-radius:20px;
  overflow:hidden;
  margin:20px 0 26px;
}

.bar span{
  display:block;
  height:100%;
  width:0%;
  border-radius:20px;
  background:linear-gradient(90deg,#39ff63,#a0ffae);
  box-shadow:0 0 15px rgba(66,255,100,.5);
  transition:width .8s ease;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.item{
  padding:17px;
  border:1px solid rgba(255,255,255,.06);
  border-radius:18px;
  background:rgba(255,255,255,.025);
}

.item label{
  display:block;
  color:#657869;
  font-size:11px;
  letter-spacing:1px;
  margin-bottom:7px;
}

.item strong{
  font-size:16px;
}

.actions{
  margin-top:22px;
}

button{
  width:100%;
  border:0;
  border-radius:17px;
  padding:16px;
  color:#031006;
  background:#76ff91;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 30px rgba(80,255,110,.2);
}

.footer{
  text-align:center;
  color:#465848;
  font-size:10px;
  letter-spacing:2px;
  margin-top:20px;
}

.error{
  color:#ff8585;
  text-align:center;
  font-size:12px;
  margin-top:15px;
}

@media(max-width:420px){
  .logo h1{
    font-size:31px;
  }

  .card{
    padding:21px;
  }

  .usage .big{
    font-size:37px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    <h1>AMIRALI</h1>
    <p>PRIVATE NETWORK</p>
  </div>

  <div class="card">

    <div class="status">
      <span class="dot"></span>
      <span id="status">CHECKING SERVER</span>
    </div>

    <div class="usage">
      <div class="big" id="used">--</div>
      <div class="small">
        used of <span id="total">--</span>
      </div>
    </div>

    <div class="bar">
      <span id="progress"></span>
    </div>

    <div class="grid">

      <div class="item">
        <label>UPLOAD</label>
        <strong id="upload">--</strong>
      </div>

      <div class="item">
        <label>DOWNLOAD</label>
        <strong id="download">--</strong>
      </div>

      <div class="item">
        <label>REMAINING</label>
        <strong id="remaining">--</strong>
      </div>

      <div class="item">
        <label>EXPIRES</label>
        <strong id="expiry">--</strong>
      </div>

    </div>

    <div class="actions">
      <button onclick="copySub()">
        COPY SUBSCRIPTION
      </button>
    </div>

    <div id="error" class="error"></div>

  </div>

  <div class="footer">
    AMIRALI • PRIVATE ACCESS
  </div>

</div>

<script>
const subUrl =
  location.origin + "/sub/amirali";

function bytes(value){

  value = Number(value || 0);

  if(!value) return "0 B";

  const units = ["B","KB","MB","GB","TB"];

  let i = 0;

  while(value >= 1024 && i < units.length - 1){
    value /= 1024;
    i++;
  }

  return value.toFixed(value >= 10 || i === 0 ? 0 : 2)
    + " " + units[i];
}

function date(value){

  if(!value || Number(value) === 0)
    return "Unlimited";

  const d = new Date(Number(value));

  if(isNaN(d.getTime()))
    return "Unknown";

  return d.toLocaleDateString("en-US",{
    year:"numeric",
    month:"short",
    day:"numeric"
  });
}

async function load(){

  try{

    const response = await fetch("/api/status",{
      cache:"no-store"
    });

    const data = await response.json();

    if(!response.ok || !data.online){
      throw new Error("offline");
    }

    document.getElementById("status").textContent =
      "SERVER ONLINE";

    document.getElementById("used").textContent =
      bytes(data.used);

    document.getElementById("total").textContent =
      data.total ? bytes(data.total) : "Unlimited";

    document.getElementById("upload").textContent =
      bytes(data.upload);

    document.getElementById("download").textContent =
      bytes(data.download);

    document.getElementById("remaining").textContent =
      data.total ? bytes(data.remaining) : "Unlimited";

    document.getElementById("expiry").textContent =
      date(data.expiry);

    let percent = 0;

    if(data.total > 0){
      percent = Math.min(
        100,
        (data.used / data.total) * 100
      );
    }

    document.getElementById("progress").style.width =
      percent + "%";

  }catch(e){

    document.getElementById("status").textContent =
      "SERVER OFFLINE";

    document.getElementById("error").textContent =
      "Subscription information unavailable.";
  }
}

async function copySub(){

  try{

    await navigator.clipboard.writeText(subUrl);

    const button = document.querySelector("button");

    const old = button.textContent;

    button.textContent = "COPIED ✓";

    setTimeout(()=>{
      button.textContent = old;
    },1500);

  }catch(e){

    alert(subUrl);

  }
}

load();

setInterval(load,30000);
</script>

</body>
      </html>
